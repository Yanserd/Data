<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f422b"/>
      <stop offset="65%" stop-color="#142b1c"/>
      <stop offset="100%" stop-color="#0a170f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3b6"/>
      <stop offset="50%" stop-color="#e9a23b"/>
      <stop offset="100%" stop-color="#c94b22"/>
    </linearGradient>
    <linearGradient id="creamText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4ead8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>

  <!-- Star motif on top -->
  <path d="M 256 75 L 261 95 L 281 100 L 261 105 L 256 125 L 251 105 L 231 100 L 251 95 Z" fill="url(#gold)" filter="url(#shadow)"/>

  <!-- 1529 Number -->
  <text x="256" y="295" 
        font-family="'Fraunces', Georgia, 'Times New Roman', serif" 
        font-size="152" 
        font-weight="700" 
        letter-spacing="-2px"
        text-anchor="middle" 
        fill="url(#creamText)" 
        filter="url(#shadow)">1529</text>

  <!-- Subtitle -->
  <text x="256" y="358" 
        font-family="'Manrope', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="9px" 
        text-anchor="middle" 
        fill="url(#gold)">RESTAURANT</text>
  
  <!-- Bottom arc line -->
  <path d="M 176 395 Q 256 415 336 395" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
</svg>